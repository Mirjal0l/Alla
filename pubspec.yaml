name: alla
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  top_snackbar_flutter: ^3.3.0
  hive: ^2.2.3
  go_router: ^16.3.0
  flutter:
    sdk: flutter

  google_fonts: ^6.3.3
  fluttertoast: ^9.0.0
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.8
  mask_text_input_formatter: ^2.0.0
  pin_input_text_field: ^4.5.2
  # bloc state manager
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  # equatable
  equatable: ^2.0.5
  # http: ^1.1.0 instead we use dio:
  dio: ^5.4.0
  get_it: ^9.1.0
  path_provider: ^2.1.5
  dio_retry_plus: ^2.0.8
  package_info_plus: ^9.0.0
  gap: ^3.0.1
  image_picker: ^1.2.1
  video_player: ^2.10.1
  wakelock_plus: ^1.4.0
  volume_controller: ^3.4.1
  audio_session: ^0.2.2
  audioplayers: ^6.5.1
  just_audio: ^0.10.5
  audio_waveforms: ^2.0.1
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.14.4"
  # For BLoC code generation (optional but helpful)
  bloc_test: ^9.1.4

flutter_icons:
  android: true
  image_path: "assets/images/logo.png"


flutter:
  assets:
    - assets/icons/
    - assets/images/
    - assets/audio/

  uses-material-design: true

